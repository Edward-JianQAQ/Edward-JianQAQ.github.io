# ---- Research --------------------------------------------------------------
vision: >-
  I build systems that let LLM agents answer hard analytical questions over data that is
  scattered, heterogeneous, and multimodal: relational and graph databases, documents,
  videos, and the desktop software where much of that data actually lives.

thesis: "A Multi-Agent Architecture for Complex Analytical Tasks over Heterogeneous Federated Systems"

themes:
  - key: data
    title: "Agentic data management"
    icon: database
    text: >-
      Natural-language interfaces to relational and graph databases, multi-agent analytics
      over federated data lakes, and the interplay between LLMs and data management systems.
    works:
      - { name: "RA-SQL",        venue: "SIGMOD '27" }
      - { name: "InteracSPARQL", venue: "ACL '26 F",  url: "https://arxiv.org/abs/2511.02002" }
      - { name: "LazyVLM",       venue: "ICDE '26",   url: "https://arxiv.org/abs/2505.21459" }
      - { name: "LLM ⇄ DBMS duality", venue: "IEEE DEB", url: "http://sites.computer.org/debull/A26mar/p40.pdf" }
  - key: agents
    title: "Computer-use & tool-use agents"
    icon: cursor
    text: >-
      Benchmarks, large-scale human demonstrations, grounding models, and RL training for agents
      that operate real desktop software and tools (MCP).
    works:
      - { name: "UI-Vision",       venue: "ICML '25",  url: "https://uivision.github.io/" }
      - { name: "GroundCUA",       venue: "ICLR '26",  url: "https://groundcua.github.io/" }
      - { name: "CUA-Suite",       venue: "ICLR-W '26", url: "https://cua-suite.github.io/" }
      - { name: "StateAct",        venue: "preprint",  url: "https://arxiv.org/abs/2607.22798" }
      - { name: "MCP-Universe RL", venue: "preprint",  url: "https://mcp-universe.github.io/mcpu-rl" }
  - key: multimodal
    title: "Multimodal & structured-data learning"
    icon: layers
    text: >-
      Vision-language models for documents, posters, and molecules; LLMs and vision models on
      graphs; representation learning for tables.
    works:
      - { name: "BigDocs",      venue: "ICLR '25",    url: "https://bigdocs.github.io/" }
      - { name: "Paper2Poster", venue: "NeurIPS '25", url: "https://paper2poster.github.io/" }
      - { name: "AlignVLM",     venue: "NeurIPS '25", url: "https://arxiv.org/abs/2502.01341" }
      - { name: "GraphOmni",    venue: "ICLR '26",    url: "https://gai-community.github.io/Graph-Omni/" }
      - { name: "TRL-Bench",    venue: "NeurIPS '26", url: "https://logo-cuhksz.github.io/trl-bench.github.io/" }

